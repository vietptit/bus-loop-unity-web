<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Bus Line</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd3ff; }
  #unity-canvas { position: absolute; display: block; background: #8fd3ff; touch-action: none; outline: none; }
  #load { position: absolute; top: 0; height: 100%; background: #49a6f0 url("loading_bg.jpg") center top / cover no-repeat;
          font: 800 18px system-ui, "Segoe UI", sans-serif; color: #fff; text-align: center; z-index: 2; }
  #ribbon { position: absolute; left: 0; right: 0; top: 31.2%; transform: translateY(-50%); font-size: min(5.2vw, 3vh);
            color: #fff; -webkit-text-stroke: 1.5px #a8400f; paint-order: stroke fill; text-shadow: 0 2px 0 #a8400f; }
  #bottom { position: absolute; left: 12%; right: 12%; bottom: 6%; }
  #msg { text-shadow: 0 2px 0 #b4501a, 0 0 6px rgba(120,60,20,.6); margin-bottom: 8px; font-size: 20px; }
  #track { height: 26px; border-radius: 16px; padding: 4px; background: linear-gradient(#ffd25a, #f2a43a);
           box-shadow: 0 4px 0 #b4501a, 0 8px 14px rgba(80,40,10,.3); }
  #trackin { height: 100%; border-radius: 12px; background: #5b3a26; overflow: hidden; }
  #bar { height: 100%; width: 0; border-radius: 12px; transition: width .2s;
         background: linear-gradient(#a8ee6a 0 35%, #6bcb3b 35% 80%, #47a82a 80%); }
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="load"><div id="ribbon">Vẽ đường đón khách</div>
  <div id="bottom"><div id="msg">Đang tải…</div><div id="track"><div id="trackin"><div id="bar"></div></div></div></div></div>
<script>
  // portrait 9:16 game: fill a phone screen; on a wide screen keep 9:16, centred, full height
  var canvas = document.getElementById('unity-canvas');
  function fit() {
    var w = window.innerWidth, h = window.innerHeight, cw = w, ch = h;
    if (w / h > 9 / 16) { cw = Math.round(h * 9 / 16); }
    canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
    canvas.style.left = Math.round((w - cw) / 2) + 'px'; canvas.style.top = '0px';
    var l = document.getElementById('load');
    if (l) { l.style.width = cw + 'px'; l.style.left = canvas.style.left; }
  }
  window.addEventListener('resize', fit); fit();
</script>
<script src="Build/b23dd96997961653e2825455633aac82.loader.js"></script>
<script>
  createUnityInstance(canvas, {
    dataUrl: "Build/86d4189f7819944b41a4ab585c4b0b2f.data.unityweb",
    frameworkUrl: "Build/142734d97be9d78a467d0526e82cfee2.framework.js.unityweb",
    codeUrl: "Build/b50bde5b5dbe24ba4e53b6673e63e527.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "BusLoop",
    productName: "Bus Line",
    productVersion: "1.0",
    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
  }, function (p) { document.getElementById('bar').style.width = (p * 100) + '%'; })
  .then(function () { document.getElementById('load').remove(); })
  .catch(function (m) { console.error(m); document.getElementById('msg').textContent = 'Không tải được game — hãy tải lại trang (Ctrl+F5)'; });
</script>
</body>
</html>
